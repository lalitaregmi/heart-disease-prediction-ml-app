<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% extends 'prediction/base.html' %}

{% block title %}Confirm Delete Article - HeartGuard{% endblock %}

{% block content %}
<div class="bg-gray-100 min-h-screen py-12">
    <div class="container mx-auto px-4 max-w-lg">

        <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-6 text-center">
            <i class="fas fa-exclamation-triangle mr-3 text-red-600"></i>Confirm Deletion
        </h1>

        <div class="bg-white p-8 rounded-lg shadow-lg text-center">
            <p class="text-lg text-gray-700 mb-6">
                Are you sure you want to delete the article titled:
                <br>
                <strong class="font-semibold">"{{ article.title }}"</strong>?
            </p>
            <p class="text-sm text-red-600 mb-8">This action cannot be undone.</p>

            <form method="post">
                {% csrf_token %}
                <div class="flex items-center justify-center space-x-4">
                    <a href="{% url 'prediction:doctor_article_list' %}" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-5 rounded-lg transition duration-300">
                        Cancel
                    </a>
                    <button type="submit" class="bg-red-600 hover:bg-red-800 text-white font-bold py-2 px-5 rounded-lg transition duration-300 inline-flex items-center">
                        <i class="fas fa-trash-alt mr-2"></i> Yes, Delete
                    </button>
                </div>
            </form>
        </div>

    </div>
</div>
{% endblock %}
    
</body>
</html>
